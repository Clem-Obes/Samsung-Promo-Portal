{% extends 'base.html' %}
{% block title %}Payment Success - Samsung Promo Portal{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card text-center" data-aos="zoom-in">
            <div class="mb-4">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
            </div>
            <h2 class="fw-bold mb-3">Payment Successful!</h2>
            <p class="text-muted fs-5 mb-4">Your membership has been activated. You now have access to exclusive promotional campaigns and rewards.</p>
            <div class="d-flex gap-3 justify-content-center flex-wrap">
                <a href="{% url 'dashboard:home' %}" class="btn btn-samsung btn-lg rounded-pill px-4">
                    <i class="bi bi-speedometer2 me-2"></i> Go to Dashboard
                </a>
                <a href="{% url 'promotions:campaigns' %}" class="btn btn-samsung-outline btn-lg rounded-pill px-4">
                    <i class="bi bi-megaphone-fill me-2"></i> View Campaigns
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
